<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#23262b; --bg:#f3f2ef; --card:#fff; --mute:#71767e; --hair:#e7e7e2;
  --soft:rgba(35,38,43,.09); --softer:rgba(35,38,43,.05);
  --pad:20px; --r:24px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  --tint-breakfast:#ffe9d6; --line-breakfast:#f0a868;
  --tint-lunch:#dff0d8;     --line-lunch:#78b369;
  --tint-snack:#fde0e9;     --line-snack:#e089a8;
  --tint-dinner:#e4e0f7;    --line-dinner:#9186d6;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.45;
  overflow-x:hidden;overscroll-behavior-y:none;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
main{max-width:600px;margin:0 auto;padding:0 var(--pad)}
.pt{padding-top:calc(18px + env(safe-area-inset-top))}

/* chips */
.chip{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.085em;text-transform:uppercase;
  padding:2.5px 7px;border-radius:20px;background:var(--softer);border:1px solid var(--ink);color:var(--ink);
  white-space:nowrap}
.chip.key{background:var(--soft)}
.chip.t-breakfast{background:var(--tint-breakfast);border-color:var(--line-breakfast)}
.chip.t-lunch{background:var(--tint-lunch);border-color:var(--line-lunch)}
.chip.t-snack{background:var(--tint-snack);border-color:var(--line-snack)}
.chip.t-dinner{background:var(--tint-dinner);border-color:var(--line-dinner)}

/* header */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.h-day{font-size:33px;font-weight:900;letter-spacing:-.04em;line-height:1}
.h-date{font-size:12.5px;font-weight:650;color:var(--mute);margin-top:4px}
.chips-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px}
.days{display:flex;gap:5px;justify-content:space-between;margin:17px 0 20px}
.dayb{flex:1;aspect-ratio:1;max-width:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:800;border:1px solid var(--ink);background:var(--card);color:var(--ink);
  position:relative;transition:background .15s}
.dayb.on{background:var(--soft)}
.dayb.today::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--ink)}

/* section rule */
.sec{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.sec-l{font-size:12.5px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.sec-r{flex:1;height:1px;background:var(--ink)}
.sec+.sec{margin-top:20px}
section{margin-top:20px}

/* cards */
.card{background:var(--card);border:1px solid var(--ink);border-radius:var(--r);padding:15px 17px;margin-bottom:11px}
.meal{display:flex;align-items:center;gap:13px;padding:14px;width:100%}
.tile{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;border:1px solid var(--ink)}
.tile.t-breakfast{background:var(--tint-breakfast);border-color:var(--line-breakfast)}
.tile.t-lunch{background:var(--tint-lunch);border-color:var(--line-lunch)}
.tile.t-snack{background:var(--tint-snack);border-color:var(--line-snack)}
.tile.t-dinner{background:var(--tint-dinner);border-color:var(--line-dinner)}
.m-body{flex:1;min-width:0}
.m-chips{display:flex;gap:5px;flex-wrap:wrap}
.m-name{font-size:18.5px;font-weight:800;letter-spacing:-.028em;line-height:1.1;margin-top:6px}
.m-detail{font-size:12px;font-weight:500;color:var(--mute);margin-top:5px}
.serve{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink);background:var(--softer);border:1px solid var(--mute);border-radius:4px;
  padding:.5px 4.5px;margin-right:6px;vertical-align:1px}
.m-from{font-size:11px;font-weight:700;color:var(--mute);margin-top:6px}
.chev{width:30px;height:30px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;padding-bottom:1px}

/* exercise rows — reps and load are one right-aligned pair with a fixed gap */
.ex{display:flex;align-items:center;gap:12px;padding:9px 0}
.ex+.ex{border-top:1px solid var(--hair)}
.ex-n{flex:1;min-width:0;font-size:15.5px;font-weight:750;letter-spacing:-.015em}
.ex-n .det{font-weight:500;color:var(--mute)}
.ex-m{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ex-r{font-size:16px;font-weight:800;letter-spacing:-.02em}

.seg{display:flex;gap:4px;background:var(--softer);border:1px solid var(--ink);
  border-radius:26px;padding:4px;margin:18px 0 20px}
.seg button{flex:1;padding:9px 0;border-radius:22px;text-align:center;font-size:12.5px;
  font-weight:750;letter-spacing:-.005em;color:var(--mute);border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s}
.seg button.on{background:var(--card);border-color:var(--ink);color:var(--ink)}
.sItem{display:flex;gap:12px;align-items:center;padding:11px 0;width:100%;
  transition:opacity .14s}
.sItem+.sItem{border-top:1px solid var(--hair)}
.sItem .chk{width:21px;height:21px;border-radius:7px;border:1px solid var(--ink);
  flex-shrink:0;position:relative;background:#fff;transition:background .14s}
.sItem.done .chk{background:var(--ink)}
.sItem .chk::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);
  transition:transform .16s cubic-bezier(.3,1.4,.6,1)}
.sItem.done .chk::after{transform:rotate(45deg) scale(1)}
.sItem .t{flex:1;min-width:0;font-size:14.5px;font-weight:650;letter-spacing:-.012em}
.sItem.done{opacity:.45}
.sItem.done .t{text-decoration:line-through}
.clearb{font-size:8.5px;font-weight:800;letter-spacing:.085em;text-transform:uppercase;
  padding:5px 11px;border:1px solid var(--ink);border-radius:20px;background:var(--softer);
  flex-shrink:0}
.clearb[disabled]{opacity:.35}
.prep{padding:12px 0}
.prep+.prep{border-top:1px solid var(--hair)}
.prep-top{display:flex;align-items:center;gap:12px}
.prep-w{flex:1;min-width:0;font-size:15.5px;font-weight:750;letter-spacing:-.015em}
.prep-how{font-size:12.5px;font-weight:500;color:var(--mute);margin-top:5px;line-height:1.45}
.empty{text-align:center;padding:34px 20px}
.empty-t{font-size:20px;font-weight:800;letter-spacing:-.03em}
.empty-s{font-size:13.5px;font-weight:550;color:var(--mute);margin-top:6px}
.note{font-size:13px;font-weight:500;line-height:1.5;background:var(--card);border:1px solid var(--ink);
  border-radius:20px;padding:13px 16px;margin-bottom:11px}
.note b{font-weight:800}
.note.tinted{background:var(--tint-lunch);border-color:var(--line-lunch)}
.cardio{display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;color:var(--ink);
  background:var(--card);border:1px solid var(--ink);border-radius:20px;padding:12px 16px;margin-bottom:11px}
.foot{font-size:11.5px;font-weight:600;color:var(--mute);text-align:center;margin:14px 0 4px}

/* recipe */
.hero{text-align:center;padding:20px}
.hero .tile{width:76px;height:76px;border-radius:26px;font-size:36px;margin:0 auto 13px}
.hero h1{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1.05}
.hero .metas{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.rnd{width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.li{display:flex;gap:11px;align-items:baseline;padding:10px 0}
.li+.li{border-top:1px solid var(--hair)}
.li .dot{width:5px;height:5px;border-radius:50%;background:var(--line-lunch);flex-shrink:0}
.li span.t{font-size:14.5px;font-weight:650;letter-spacing:-.012em}
.step{display:flex;gap:13px;padding:13px 0}
.step+.step{border-top:1px solid var(--hair)}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--soft);border:1px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.step p{font-size:14px;font-weight:500;line-height:1.5}

/* week list */
.wk{display:flex;align-items:center;gap:13px;padding:14px;width:100%}
.wk-d{width:46px;flex-shrink:0}
.wk-d b{display:block;font-size:14px;font-weight:900;letter-spacing:-.02em}
.wk-d span{display:block;font-size:10.5px;font-weight:700;color:var(--mute);margin-top:1px}
.wk-b{flex:1;min-width:0}
.wk-t{font-size:15.5px;font-weight:800;letter-spacing:-.022em}
.wk-m{font-size:11.5px;font-weight:500;color:var(--mute);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.view[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const PLAN = {"meta": {"title": "Week", "updated": "2026-10-10", "oven": "fan-forced", "household": 2, "goal": "Lean and toned. Hold the muscle you have while the deficit does the rest — long-term strength and bone density come free from the same work.", "dayTargets": {"kcal": "1,700 kcal", "protein": "130g protein"}, "everyMorning": "Coffee with Califia oat milk", "note": "Calorie figures are a ballpark — set without a bodyweight or activity level. If nothing has moved in 2–3 weeks, take ~100 kcal of carbs out of lunch.", "cookPattern": "You cook every night. Each cook makes 4 serves: 2 for dinner that evening, 2 for lunch the next day. Nothing is batched further ahead than that and nothing goes in the freezer, so every lunch is the night before's dinner.", "ovenNote": "All temperatures are fan-forced. Add 20°C if you ever use a conventional oven.", "servingNote": "Everything on a day is shown per person. Each dinner is cooked for 4 — two plates tonight, two containers for tomorrow's lunch."}, "kitchen": ["Rice is cooked fresh with each dinner, including the portion going into tomorrow's lunch. Cool that portion quickly and get it in the fridge the same night — rice left standing at room temperature is the one real food-safety risk in this plan.", "Steak and fish are the two that don't reheat. Eat those lunches cold — steak sliced thin, salmon flaked over the sweet potato. Both are genuinely good cold; both are poor microwaved.", "Lunch containers are built the night before, straight off the stove, while you're plating dinner.", "Salmon handles the next day far better than barramundi — the fat keeps it moist. Use barramundi on a night you'll eat both serves fresh, otherwise take the salmon."], "mealKey": {"yoghurt-bowl": {"name": "Yoghurt bowl", "ic": "🍓", "tint": "breakfast", "detail": "200g greek yoghurt + 100g strawberries", "items": ["200g high-protein greek yoghurt", "100g strawberries"]}, "eggs-banana": {"name": "Eggs and banana", "ic": "🥚", "tint": "breakfast", "detail": "2 boiled eggs + 1 banana", "items": ["2 boiled eggs", "1 banana"]}, "chicken-bowl": {"name": "Chicken bowl", "ic": "🍗", "tint": "lunch", "detail": "150g chicken, 150g rice, roasted capsicum and broccolini", "recipe": {"serves": 4, "time": "~35 min", "makes": "2 dinners tonight · 2 lunches tomorrow", "ingredients": ["600g chicken breast (4 × 150g)", "600g cooked rice, or 4 medium potatoes", "2 capsicum, sliced thick", "2 bunches broccolini", "Olive oil spray", "Salt, pepper, smoked paprika, garlic powder"], "method": ["Oven to 200°C fan. Spread the capsicum on a tray, spray with oil, salt it, roast 20 minutes.", "Season the chicken all over with salt, pepper, paprika and garlic powder.", "Pan-fry over medium-high, 5–6 minutes a side, until the thickest part reads 74°C. Don't crowd the pan — do it in two batches if you need to.", "Throw the broccolini into the same pan for the last 3 minutes with a splash of water and a lid on, so it steams in the chicken fat.", "Rest the chicken 5 minutes before slicing, or the juice ends up on the board. Build two bowls for tonight, two into containers for tomorrow."], "note": "Slightly undercook the broccolini for the lunch containers — it keeps cooking in the fridge and reheats better."}}, "burrito-bowl": {"name": "Burrito bowl", "ic": "🌯", "tint": "lunch", "detail": "150g lean beef mince, rice, black beans, corn, capsicum, salsa, ¼ avocado", "recipe": {"serves": 4, "time": "~30 min", "makes": "2 dinners tonight · 2 lunches tomorrow", "ingredients": ["600g lean beef mince", "400g cooked rice", "1 tin black beans, drained", "1 tin corn, drained", "2 capsicum, diced", "1 avocado", "Salsa", "Cumin, smoked paprika, oregano, salt"], "method": ["Oven to 200°C fan. Toss the corn and capsicum with a little oil and roast 20 minutes, until the corn starts to colour.", "Brown the mince in a dry hot pan — break it up and leave it alone for the first two minutes so it catches.", "Add 2 tsp cumin, 1 tsp paprika, 1 tsp oregano and a good pinch of salt. Stir through the black beans and a splash of water, simmer 5 minutes.", "Build: rice, mince, roasted veg, salsa. Add avocado only to tonight's bowls — it browns overnight.", "Pack tomorrow's lunch without avocado and cut a fresh quarter in the morning."], "note": "The best of the week for leftovers — arguably better on day two."}}, "stir-fry": {"name": "Chicken stir-fry", "ic": "🥢", "tint": "lunch", "detail": "150g chicken, broccolini, 100g rice", "recipe": {"serves": 4, "time": "~20 min", "makes": "2 dinners tonight · 2 lunches tomorrow", "ingredients": ["600g chicken thigh or breast, sliced thin", "3 bunches broccolini, cut into thirds", "400g cooked rice", "3 cloves garlic and 1 thumb ginger, both minced", "3 tbsp soy sauce, 1 tsp sesame oil", "Neutral oil for the pan"], "method": ["Get the pan hotter than feels sensible. This is the whole trick — a cool pan steams the chicken instead of searing it.", "Chicken in one layer, 2 minutes without touching it, then toss until just cooked through. Set aside.", "Broccolini in, 3 minutes, then garlic and ginger for 30 seconds — any longer and the garlic turns bitter.", "Return the chicken, add the soy and sesame, toss for 30 seconds and kill the heat.", "Serve over rice. Two plates tonight, two containers for tomorrow."], "note": "Thigh stays far better overnight than breast — it doesn't dry out in the container."}}, "fish-plate": {"name": "Fish plate", "ic": "🐟", "tint": "lunch", "detail": "150g salmon or barramundi, 200g roasted sweet potato, roasted broccolini", "recipe": {"serves": 4, "time": "~35 min", "makes": "2 dinners tonight · 2 lunches tomorrow", "ingredients": ["4 × 150g fillets — salmon, or barramundi if you'll eat all four fresh", "800g sweet potato, cut into 3cm chunks", "2 bunches broccolini", "Olive oil spray, salt, pepper, 1 lemon"], "method": ["Oven to 200°C fan. Sweet potato on a tray, sprayed and salted, 30 minutes — shake it halfway.", "Add the broccolini to the same tray for t const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip = (t,cls) => '<span class="chip '+(cls||'')+'">'+esc(t)+'</span>';

/* dates */
const pad = n => String(n).padStart(2,'0');
function mondayOf(r){const x=new Date(r);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
const NOW=new Date(), MONDAY=mondayOf(NOW), TODAY=(NOW.getDay()+6)%7;
const dateFor = i => {const d=new Date(MONDAY);d.setDate(d.getDate()+i);return d;};
let idx = TODAY, tab = 'day', seg = 'meals', shopTrip = 0;

/* ── day ── */
function renderDay(){
  const d = PLAN.week[idx], w = PLAN.workouts[d.workout], date = dateFor(idx);
  let h = '<div class="pt"><div class="head"><div>'
    + '<div class="h-day">'+esc(d.day)+'</div>'
    + '<div class="h-date">'+date.toLocaleDateString(undefined,{day:'numeric',month:'long'})
      + (idx===TODAY?' · today':'')+'</div></div>'
    + '<button class="rnd" id="cart" aria-label="Shopping">\u{1F6D2}</button></div>'
    + '<div class="chips-row">'+chip(PLAN.meta.dayTargets.kcal)
      + chip(PLAN.meta.dayTargets.protein,'key')+chip('per person')+'</div>';

  h += '<div class="days">' + PLAN.week.map((x,i)=>
    '<button class="dayb'+(i===idx?' on':'')+(i===TODAY?' today':'')+'" data-day="'+i+'">'+esc(x.day[0])+'</button>'
  ).join('') + '</div>';

  h += '<div class="seg">'
    + '<button class="'+(seg==='meals'?'on':'')+'" data-seg="meals">Meals</button>'
    + '<button class="'+(seg==='training'?'on':'')+'" data-seg="training">Training</button>'
    + '</div></div>';

  if (seg === 'meals') {
    PLAN.slots.forEach(slot=>{
      const id = d.meals[slot.id], m = PLAN.mealKey[id];
      if(!m) return;
      const tint = 't-'+slot.id;
      const from = (slot.id==='lunch' && d.lunchFrom) ? d.lunchFrom : '';
      const cook = (slot.id==='dinner' && d.cookTonight===id);
      const linkable = m.recipe && !from;
      h += '<'+(linkable?'button':'div')+' class="card meal" '+(linkable?'data-recipe="'+esc(id)+'"':'')+'>'
        + '<span class="tile '+tint+'">'+m.ic+'</span>'
        + '<span class="m-body">'
        + '<span class="m-chips">'+chip(slot.label,tint)
          + (from?chip('Leftovers'):'') + (cook?chip('Cook for 4','key'):'') + '</span>'
        + '<span class="m-name" style="display:block">'+esc(m.name)+'</span>'
        + (m.detail?'<span class="m-detail" style="display:block"><span class="serve">1 serve</span>'+esc(m.detail)+'</span>':'')
        + (from?'<span class="m-from" style="display:block">From '+esc(from)+'</span>':'')
        + (cook?'<span class="m-from" style="display:block">'+esc(m.recipe.makes)+'</span>':'')
        + '</span>'
        + (linkable?'<span class="chev">\u203A</span>':'')
        + '</'+(linkable?'button':'div')+'>';
    });
    h += '<div class="foot">'+esc(PLAN.meta.note)+'</div>';
  } else {
    if(!w.isRest)
      h += '<div class="sec" style="margin-top:4px"><span class="sec-l">'+esc(w.title)+'</span>'
         + '<span class="sec-r"></span>'+chip(w.subtitle.split(' · ').pop())+'</div>';
    if(w.isRest){
      h += '<div class="card empty"><div class="empty-t">Rest day</div>'
        + '<div class="empty-s">'+esc(d.cardio || 'Cardio or rest')+'</div></div>';
    } else {
      w.supersets.forEach(ss=>{
        h += '<div class="card"><div style="display:flex;gap:6px;margin-bottom:10px">'
          + chip('Set '+ss.label,'key') + chip(ss.rounds+' rounds') + '</div>'
          + ss.exercises.map(e=>'<div class="ex">'
              + '<span class="ex-n">'+esc(e.name)+(e.detail?' <span class="det">\u00B7 '+esc(e.detail)+'</span>':'')+'</span>'
              + '<span class="ex-m">'+chip(e.load)+'<span class="ex-r">'+esc(e.reps)+'</span></span>'
            + '</div>').join('')
          + '</div>';
      });
      h += '<div class="foot">'+esc(w.rest)+'</div>';
    }
    if(d.cardio && !w.isRest) h += '<div class="cardio">'+chip('Cardio','key')+'<span>'+esc(d.cardio)+'</span></div>';
  }

  document.getElementById('vDay').innerHTML = h;
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ idx=+b.dataset.day; renderDay(); scrollTo(0,0); });
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{ seg=b.dataset.seg; renderDay(); });
  document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{ renderRecipe(b.dataset.recipe); show('recipe'); });
  document.getElementById('cart').onclick = ()=>{ renderShop(); show('shop'); };
}

/* ── recipe ── */
function renderRecipe(id){
  const m = PLAN.mealKey[id], r = m.recipe;
  let h = '<div class="pt"><div class="topbar">'
    + '<button class="rnd" id="back" style="padding-right:2px">\u2039</button>'
    + chip('Cook for '+r.serves,'t-lunch')
    + '<span style="width:38px"></span></div>'
    + '<div class="card hero"><span class="tile t-lunch">'+m.ic+'</span>'
    + '<h1>'+esc(m.name)+'</h1><div class="metas">'
    + chip(r.time)+chip('Serves '+r.serves)+chip(PLAN.meta.oven)+'</div></div>'
    + '<div class="note"><b>'+esc(r.makes)+'.</b> '+esc(m.detail)+' per serve.</div>'
    + '<div class="sec"><span class="sec-l">Ingredients</span><span class="sec-r"></span></div><div class="card">'
    + r.ingredients.map(x=>'<div class="li"><span class="dot"></span><span class="t">'+esc(x)+'</span></div>').join('')
    + '</div>'
    + '<div class="sec"><span class="sec-l">Method</span><span class="sec-r"></span></div><div class="card">'
    + r.method.map((x,i)=>'<div class="step"><span class="n">'+(i+1)+'</span><p>'+esc(x)+'</p></div>').join('')
    + '</div>'
    + (r.note?'<div class="note tinted"><b>Worth knowing.</b> '+esc(r.note)+'</div>':'')
    + '<div class="foot">'+esc(PLAN.meta.ovenNote)+'</div></div>';
  document.getElementById('vRecipe').innerHTML = h;
  document.getElementById('back').onclick = ()=>show('day');
}

/* ── shop ── */
function renderShop(){
  const trips = PLAN.shopping, S = 'health.shop.v1';
  const read  = () => { try { return JSON.parse(localStorage.getItem(S)) || {}; } catch { return {}; } };
  const write = s => { try { localStorage.setItem(S, JSON.stringify(s)); } catch {} };

  function draw(){
    const state = read(), trip = trips[shopTrip], keys = [];
    trip.sections.forEach((sec,si)=>sec.items.forEach((_,ii)=>keys.push(shopTrip+'-'+si+'-'+ii)));
    const done = keys.filter(k=>state[k]).length;

    let h = '<div class="pt"><div class="topbar">'
      + '<button class="rnd" id="shopback" style="padding-right:2px">\u2039</button>'
      + '<button class="clearb" id="clear"'+(done?'':' disabled')+'>Clear</button></div>'
      + '<div class="head"><div><div class="h-day">Shopping</div>'
      + '<div class="h-date">'+esc(trip.covers)+'</div></div></div>'
      + '<div class="seg">' + trips.map((t,i)=>
          '<button class="'+(i===shopTrip?'on':'')+'" data-trip="'+i+'">'+esc(t.trip)+'</button>').join('')
      + '</div></div>';

    trip.sections.forEach((sec,si)=>{
      h += '<div class="sec"><span class="sec-l">'+esc(sec.section)+'</span><span class="sec-r"></span></div>'
        + '<div class="card">'
        + sec.items.map((x,ii)=>{
            const k = shopTrip+'-'+si+'-'+ii;
            return '<button class="sItem'+(state[k]?' done':'')+'" data-k="'+k+'">'
              + '<span class="chk"></span><span class="t">'+esc(x)+'</span></button>';
          }).join('')
        + '</div>';
    });
    h += '<div class="foot">'+done+' of '+keys.length+' picked up</div>';

    const v = document.getElementById('vShop');
    v.innerHTML = h;
    v.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{ shopTrip=+b.dataset.trip; draw(); });
    v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
      const s = read(), k = b.dataset.k;
      if (s[k]) delete s[k]; else s[k] = 1;
      write(s); draw();
    });
    document.getElementById('shopback').onclick = ()=>show('day');
    const c = document.getElementById('clear');
    if (c) c.onclick = ()=>{ const s = read(); keys.forEach(k=>delete s[k]); write(s); draw(); };
  }
  draw();
}

/* ── views ── */
function show(which){
  tab = which;
  ['day','recipe','shop'].forEach(v=>{
    document.getElementById('v'+v[0].toUpperCase()+v.slice(1)).hidden = (v!==which);
  });
  scrollTo(0,0);
}

/* swipe between days */
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(tab!=='day') return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*2){ idx=(idx+(dx<0?1:6))%7; renderDay(); }
},{passive:true});

renderDay();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0)
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
